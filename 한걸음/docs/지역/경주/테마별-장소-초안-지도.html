 function choose(id,button){if(layer)map.removeLayer(layer);document.querySelectorAll('.theme').forEach(x=>x.classList.remove('active'));button.classList.add('active');const group=groups.get(id);layer=L.featureGroup(group.items.map(f=>{const [lon,lat]=f.geometry.coordinates;return L.circleMarker([lat,lon],{radius:7,color:'#256b45',weight:2,fillColor:'#5eaa73',fillOpacity:.9}).bindPopup('<span class="tag">'+group.name+'</span><br><strong>'+f.properties.name+'</strong>')})).addTo(map);if(group.items.length)map.fitBounds(layer.getBounds().pad(.18));}
 for(const id of order){const group=groups.get(id);if(!group)continue;const b=document.createElement('button');b.className='theme';b.innerHTML='<b>'+group.name+'</b><span>'+group.items.length+'곳</span>';b.onclick=()=>choose(id,b);menu.appendChild(b)}
 const first=menu.querySelector('.theme');if(first)first.click();
})().catch(error=>{document.getElementById('map').innerHTML='<p style="padding:24px">초안 GeoJSON을 불러오지 못했습니다: '+error+'</p>'});
</script>
</body></html>
