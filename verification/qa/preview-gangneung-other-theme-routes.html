<!doctype html><html lang="ko"><meta charset="utf-8"><title>강릉 다른 테마 보행선 검토</title><link rel="stylesheet" href="../../public/vendor/leaflet.css"><style>body{margin:0;font:15px system-ui}main{display:grid;grid-template-columns:1fr 300px;height:100vh}#map{height:100vh}aside{padding:20px}li{margin:12px 0}button{padding:8px;margin-right:7px}</style><main><div id="map"></div><aside><h2>강릉 보행선 검토</h2><div id="choices"></div><p id="summary"></p><ol id="stops"></ol><p>실제 출입구·횡단보도 현장 확인 전. 네이버 요약과 OSM 선 차이가 큰 구간을 검토합니다.</p></aside></main><script src="../../public/vendor/leaflet.js"></script><script>fetch('gangneung-other-theme-route-geometries-2026-10-07.json').then(r=>r.json()).then(data=>{let map=L.map('map'),layer=L.layerGroup().addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);function show(route){layer.clearLayers();let p=route.geometry.coordinates.map(([lon,lat])=>[lat,lon]),line=L.polyline(p,{color:'#087a61',weight:5}).addTo(layer);route.stops.forEach((s,i)=>{L.circleMarker([s.lat,s.lon],{radius:8,color:'white',weight:2,fillColor:'#174a70',fillOpacity:1}).addTo(layer).bindTooltip((i+1)+'. '+s.name)});document.querySelector('#summary').textContent=route.id+' · '+route.meters+'m · '+p.length+'점';document.querySelector('#stops').innerHTML=route.legs.map(l=>'<li>'+l.from+'→'+l.to+' · OSM '+l.meters+'m / 네이버 '+l.naverMeters+'m</li>').join('');map.fitBounds(line.getBounds(),{padding:[25,25]})}data.routes.forEach(r=>{let b=document.createElement('button');b.textContent=r.id;b.onclick=()=>show(r);document.querySelector('#choices').append(b)});show(data.routes[0])})</script></html>
