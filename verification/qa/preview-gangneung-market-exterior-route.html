<!doctype html><html lang="ko"><meta charset="utf-8"><title>강릉 시장 외곽 보행 코스 검토</title><link rel="stylesheet" href="../../public/vendor/leaflet.css"><style>body{margin:0;font:15px system-ui}main{display:grid;grid-template-columns:1fr 290px;height:100vh}#map{height:100vh}aside{padding:20px}li{margin:12px 0}small{line-height:1.5;color:#555}</style><main><div id="map"></div><aside><h2>시장 외곽 보행 코스</h2><p>검토용 1.377km · 배니닭강정 정차 제외</p><ol id="stops"></ol><small>중앙시장은 건물 외곽 도로 접근점만 표시합니다. 시장 내부 통로·출입구는 선에 포함하지 않았습니다.</small></aside></main><script src="../../public/vendor/leaflet.js"></script><script>fetch('gangneung-market-exterior-route-2026-10-07.json').then(r=>r.json()).then(d=>{const map=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const pts=d.geometry.coordinates.map(([lon,lat])=>[lat,lon]);const line=L.polyline(pts,{color:'#087a61',weight:5}).addTo(map);d.stops.forEach((p,i)=>{L.circleMarker([p.lat,p.lon],{radius:8,color:'white',weight:2,fillColor:'#174a70',fillOpacity:1}).addTo(map).bindTooltip((i+1)+'. '+(p.routeLabel||p.name));let li=document.createElement('li');li.textContent=p.routeLabel||p.name;document.querySelector('#stops').append(li)});map.fitBounds(line.getBounds(),{padding:[25,25]})}).catch(e=>document.querySelector('aside').append(e.message))</script></html>
